spec_version: "0.1.0"
name: git-leaseaudit
version: 1.0.0
description: "Autonomous Commercial Real Estate Lease Audit, CAM Reconciliation & Rent Escalation Agent"
author: "masood-mashu"
license: "Apache-2.0"

model:
  preferred: "openai:gpt-4o"
  fallback:
    - "anthropic:claude-3-5-sonnet"
    - "openai:gpt-4o-mini"
  constraints:
    temperature: 0.1
    max_tokens: 4096

skills:
  - commercial-lease-auditing
  - boma-measurement-standards

tools:
  - cam-reconciliation-auditor
  - rent-escalation-calculator
  - square-footage-prorator

runtime:
  max_turns: 50
  timeout: 120

tags:
  - real-estate
  - lease-audit
  - cam-reconciliation
  - rent-escalation
  - passport-challenge

metadata:
  passport_id: "aps-leaseaudit-01"
  passport_category: "Real estate"
