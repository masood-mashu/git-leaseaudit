name: square-footage-prorator
version: 1.0.0
description: "Computes tenant proportionate share percentage of gross leasable area"
input_schema:
  type: object
  properties:
    area_json:
      type: string
      description: "JSON with tenant_sqft and building_gla_sqft"
  required:
    - area_json
implementation:
  type: script
  path: square_footage_prorator.py
  runtime: python3
annotations:
  read_only: true
  idempotent: true
