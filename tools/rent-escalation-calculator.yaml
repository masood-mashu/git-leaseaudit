name: rent-escalation-calculator
version: 1.0.0
description: "Calculates escalated annual base rent using contractual fixed percentage or CPI bump"
input_schema:
  type: object
  properties:
    escalation_json:
      type: string
      description: "JSON with current_rent_usd and escalation_pct"
  required:
    - escalation_json
implementation:
  type: script
  path: rent_escalation_calculator.py
  runtime: python3
annotations:
  read_only: true
  idempotent: true
